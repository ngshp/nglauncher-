name: NGPB Launcher Build & Sign

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'nglauncher.sln' 
  PROJECT_PATH: 'src/NgpbLauncher.csproj'
  INSTALLER_SCRIPT: 'installer/ngpb-installer.iss'
  PUBLISH_OUTPUT_DIR: './build-output'

jobs:
  build-and-package:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Debug Directory Structure
      run: |
        Write-Host "=== Root Directory ==="
        Get-ChildItem -Recurse -Filter *.sln | Select-Object FullName
        if (Test-Path src) { Get-ChildItem src } else { Write-Host "src folder not found" }
      shell: pwsh
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore Dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
      
    # PERBAIKAN KRITIS STEP 5: Bersihkan cache build & beri jeda agar file tidak terkunci
    - name: Clean Build Cache & Publish
      run: |
        # Hapus folder output lama
        if (Test-Path $env:PUBLISH_OUTPUT_DIR) { 
          Remove-Item -Recurse -Force $env:PUBLISH_OUTPUT_DIR -ErrorAction SilentlyContinue
        }
        
        # Hapus folder obj dan bin untuk mencegah file lock dari build sebelumnya
        $projectDir = Split-Path $env:PROJECT_PATH -Parent
        if (Test-Path "$projectDir/obj") { Remove-Item -Recurse -Force "$projectDir/obj" -ErrorAction SilentlyContinue }
        if (Test-Path "$projectDir/bin") { Remove-Item -Recurse -Force "$projectDir/bin" -ErrorAction SilentlyContinue }
        
        # JEDA 3 DETIK: Memberi waktu OS melepaskan handle file yang terkunci
        Start-Sleep -Seconds 3
        
        Write-Host "🔨 Starting publish process..."
        dotnet publish $env:PROJECT_PATH `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:EnableCompressionInSingleFile=true `
          -p:PublishTrimmed=true `
          -p:DebugType=none `
          -p:Optimize=true `
          -p:UseAppHost=false `
          -o $env:PUBLISH_OUTPUT_DIR
          
        if ($LASTEXITCODE -ne 0) {
            throw " dotnet publish failed with exit code $LASTEXITCODE"
        }
        Write-Host "✅ Publish completed successfully."
      shell: pwsh
      
    - name: Verify Build Output
      run: |
        Write-Host "Checking build output..."
        Get-ChildItem $env:PUBLISH_OUTPUT_DIR | Select-Object Name, Length
        if (-not (Test-Path "$env:PUBLISH_OUTPUT_DIR/NgpbLauncher.exe")) {
          throw "FATAL: NgpbLauncher.exe NOT FOUND in build output!"
        }
        Write-Host "✅ Build verified successfully."
      shell: pwsh
      
    - name: Prepare Signing Certificate
      env:
        SIGNING_CERT_B64: ${{ secrets.SIGNING_CERT_B64 }}
        CERT_PATH: '${{ runner.temp }}/ngpb-cert.pfx'
      run: |
        $certBytes = [Convert]::FromBase64String($env:SIGNING_CERT_B64)
        [IO.File]::WriteAllBytes($env:CERT_PATH, $certBytes)
        Write-Host "Certificate prepared at $env:CERT_PATH"
      shell: pwsh
        
    - name: Code Sign Launcher
      env:
        CERT_PATH: '${{ runner.temp }}/ngpb-cert.pfx'
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      run: |
        signtool sign /f $env:CERT_PATH /p $env:SIGNING_PASSWORD `
          /tr http://timestamp.digicert.com /td sha256 /fd sha256 /v `
          "$env:PUBLISH_OUTPUT_DIR\NgpbLauncher.exe"
          
    - name: Compile Installer
      run: |
        $isccPaths = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
        )
        
        $isccExe = $null
        foreach ($path in $isccPaths) {
            if (Test-Path $path) {
                $isccExe = $path
                break
            }
        }
        
        if (-not $isccExe) {
            throw "Inno Setup compiler (ISCC.exe) not found on this runner!"
        }
        
        $sourceFolder = (Resolve-Path $env:PUBLISH_OUTPUT_DIR).Path
        $outputDir = Join-Path $PWD "InstallerOutput"
        New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
        
        Write-Host "🔨 Compiling installer..."
        Write-Host "   Source Folder : $sourceFolder"
        Write-Host "   Output Folder : $outputDir"
        
        & $isccExe $env:INSTALLER_SCRIPT "/O$outputDir" "/DSourceFolder=$sourceFolder"
        
        if ($LASTEXITCODE -ne 0) {
            throw "❌ Inno Setup compilation failed with exit code $LASTEXITCODE"
        }
        
        Write-Host "✅ Installer compiled successfully!"
        Get-ChildItem $outputDir -Filter *.exe | Select-Object Name, Length
      shell: pwsh
        
    - name: Code Sign Installer
      env:
        CERT_PATH: '${{ runner.temp }}/ngpb-cert.pfx'
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      run: |
        $installerFiles = Get-ChildItem .\InstallerOutput\*.exe
        if ($installerFiles.Count -eq 0) {
            throw "No installer .exe files found in InstallerOutput!"
        }
        
        $installerFiles | ForEach-Object {
            Write-Host "Signing: $($_.FullName)"
            signtool sign /f $env:CERT_PATH /p $env:SIGNING_PASSWORD `
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 /v $_.FullName
        }

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NGPB-Launcher-v1.2.0
        path: |
          ${{ env.PUBLISH_OUTPUT_DIR }}/NgpbLauncher.exe
          ./InstallerOutput/*.exe
