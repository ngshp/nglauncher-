name: NGPB Launcher Build & Sign (Final CMD Mode)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: '' 
  INSTALLER_SCRIPT: 'installer/ngpb-installer.iss'
  PUBLISH_OUTPUT_DIR: './build-output'

jobs:
  build-and-package:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Debug Directory Structure
      run: |
        Write-Host "=== ROOT DIRECTORY ==="
        Get-ChildItem -Force
        $csproj = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
        if ($csproj) {
            echo "PROJECT_PATH=$($csproj.FullName)" >> $env:GITHUB_ENV
        } else {
            throw "❌ FATAL: No .csproj file found!"
        }
      shell: pwsh
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore Dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}
      
    - name: Build Release (Stable)
      run: |
        $tempOutput = Join-Path $PWD "temp-publish"
        New-Item -ItemType Directory -Force -Path $tempOutput | Out-Null
        
        dotnet publish ${{ env.PROJECT_PATH }} `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:DebugType=none `
          -p:Optimize=true `
          -o $tempOutput
          
        if ($LASTEXITCODE -ne 0) { throw "❌ Build failed!" }
        
        $exeFiles = Get-ChildItem $tempOutput -Filter *.exe -File
        if ($exeFiles.Count -eq 0) { throw "❌ No .exe found!" }
        
        $exeName = $exeFiles[0].Name
        New-Item -ItemType Directory -Force -Path $env:PUBLISH_OUTPUT_DIR | Out-Null
        Copy-Item "$tempOutput\$exeName" "$env:PUBLISH_OUTPUT_DIR\$exeName" -Force
        echo "DETECTED_EXE_NAME=$exeName" >> $env:GITHUB_ENV
      shell: pwsh
      
    - name: Install Inno Setup
      run: choco install innosetup -y --no-progress
      shell: pwsh

    - name: Compile Installer (CMD Mode - Raw)
      run: |
        echo "=================================================="
        echo "🔍 DIAGNOSTIC CHECK"
        echo "=================================================="
        echo "1. Checking ISCC location:"
        where iscc
        echo ""
        echo "2. Checking Installer Script:"
        dir installer\ngpb-installer.iss
        echo ""
        echo "3. Checking Source Folder (Build Output):"
        dir build-output
        echo ""
        echo "=================================================="
        echo "🔨 STARTING COMPILATION"
        echo "=================================================="
        
        "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\ngpb-installer.iss" /O"InstallerOutput" /DSourceFolder="build-output"
        
        if %ERRORLEVEL% neq 0 (
          echo ""
          echo "❌ COMPILATION FAILED! Check logs above for specific ISCC error."
          exit /b 1
        )
        
        echo ""
        echo "✅ COMPILATION SUCCESS!"
        echo "Checking output folder:"
        dir InstallerOutput
      shell: cmd
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NGPB-Launcher-Final
        path: |
          ${{ env.PUBLISH_OUTPUT_DIR }}/*.exe
          ./InstallerOutput/*.exe
