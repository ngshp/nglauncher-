name: NGPB Launcher Build & Sign (Stable)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: '' 
  INSTALLER_SCRIPT: 'installer/ngpb-installer.iss'
  PUBLISH_OUTPUT_DIR: './build-output'

jobs:
  build-and-package:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Debug Directory Structure (PENTING!)
      run: |
        Write-Host "=== ROOT DIRECTORY ==="
        Get-ChildItem -Force
        Write-Host "=== SEARCHING FOR CSPROJ ==="
        $csproj = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
        if ($csproj) {
            Write-Host "✅ Found csproj at: $($csproj.FullName)"
            echo "PROJECT_PATH=$($csproj.FullName)" >> $env:GITHUB_ENV
        } else {
            throw "❌ FATAL: No .csproj file found in the repository!"
        }
      shell: pwsh
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore Dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}
      
    - name: Build Release (Simple & Stable)
      run: |
        $tempOutput = Join-Path $PWD "temp-publish"
        if (Test-Path $tempOutput) { Remove-Item -Recurse -Force $tempOutput }
        New-Item -ItemType Directory -Force -Path $tempOutput | Out-Null
        
        Write-Host "🔨 Building project: ${{ env.PROJECT_PATH }}"
        
        # Build tanpa trimming untuk stabilitas maksimal
        dotnet publish ${{ env.PROJECT_PATH }} `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:DebugType=none `
          -p:Optimize=true `
          -o $tempOutput
          
        if ($LASTEXITCODE -ne 0) {
            throw "❌ Build failed!"
        }
        
        # Cari exe
        $exeFiles = Get-ChildItem $tempOutput -Filter *.exe -File
        if ($exeFiles.Count -eq 0) {
            Write-Host "=== Isi folder temp-publish ==="
            Get-ChildItem $tempOutput
            throw "❌ Tidak ada file .exe yang dihasilkan!"
        }
        
        $exeName = $exeFiles[0].Name
        Write-Host "✅ Executable ditemukan: $exeName"
        
        # Pindahkan ke folder output utama
        New-Item -ItemType Directory -Force -Path $env:PUBLISH_OUTPUT_DIR | Out-Null
        Copy-Item "$tempOutput\$exeName" "$env:PUBLISH_OUTPUT_DIR\$exeName" -Force
        
        echo "DETECTED_EXE_NAME=$exeName" >> $env:GITHUB_ENV
      shell: pwsh
      
    - name: Install Inno Setup
      run: choco install innosetup -y --no-progress
      shell: pwsh

    - name: Compile Installer (Final Fix)
      run: |
        # 1. Cari path ISCC.exe
        $isccExe = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $isccExe)) {
            $isccExe = Get-ChildItem "C:\Program Files*\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
        }
        
        Write-Host "Using ISCC at: $isccExe"
        
        # 2. Validasi file .iss menggunakan path absolut
        $scriptPath = Join-Path $PWD $env:INSTALLER_SCRIPT
        Write-Host "Checking for script at: $scriptPath"
        
        if (-not (Test-Path $scriptPath)) {
            Write-Host "=== ROOT DIRECTORY CONTENTS ==="
            Get-ChildItem -Force
            throw "FATAL: Installer script NOT FOUND at: $scriptPath"
        }
        
        # 3. Siapkan folder output dan source
        $sourceFolder = (Resolve-Path $env:PUBLISH_OUTPUT_DIR).Path
        $outputDir = Join-Path $PWD "InstallerOutput"
        New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
        
        Write-Host "🔨 Compiling installer..."
        Write-Host "   Script       : $scriptPath"
        Write-Host "   Source Folder: $sourceFolder"
        Write-Host "   Output Dir   : $outputDir"
        
        # 4. Jalankan ISCC dengan parameter yang sangat eksplisit
        $args = @(
            "`"$scriptPath`"", 
            "/O`"$outputDir`"", 
            "/DSourceFolder=`"$sourceFolder`""
        )
        
        Write-Host "Command: & $isccExe $args"
        $output = & $isccExe @args 2>&1
        Write-Host $output
        
        if ($LASTEXITCODE -ne 0) {
            Write-Host "=== INNO SETUP ERROR LOG ==="
            $output | Select-String -Pattern "error|warning|fatal|line" -Context 0,2
            throw "❌ Inno Setup compilation failed with exit code $LASTEXITCODE"
        }
        
        Write-Host "✅ Installer compiled successfully!"
        Get-ChildItem $outputDir -Filter *.exe | Select-Object Name, Length
      shell: pwsh
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NGPB-Launcher-Final
        path: |
          ${{ env.PUBLISH_OUTPUT_DIR }}/*.exe
          ./InstallerOutput/*.exe
